services:
  mysql:
    image: mysql:8.0
    container_name: modulo2-mysql
    restart: always
    environment:
      MYSQL_DATABASE: modulo2
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    container_name: modulo2-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/modulo2?useSSL=false&serverTimezone=UTC
    depends_on:
      - mysql

volumes:
  mysql_data: