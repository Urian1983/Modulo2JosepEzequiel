services:
  mysql:
    image: mysql:8.0
    container_name: modulo2-mysql
    restart: always
    environment:
      MYSQL_DATABASE: modulo2
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    ports:
      - "3307:3306" # Puerto 3307 del host -> 3306 interno del contenedor
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: modulo2-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/modulo2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: