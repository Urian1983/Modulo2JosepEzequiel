services:
  mysql:
    image: mysql:8.0
    container_name: modulo2-mysql
    restart: always
    environment:
      MYSQL_DATABASE: modulo2
      MYSQL_ALLOW_EMPTY_PASSWORD: "true" # Fixes the uninitialized database error
    ports:
      - "3307:3306" # Maps host port 3307 to container's internal MySQL port 3306
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: modulo2-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/modulo2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - mysql

volumes:
  mysql_data: